<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#02070b">
<title>JARVIS // ULTRON SYSTEM HUB</title>
<style>
:root{--jarvis:#5ce7ff;--ultron:#ff3f59;--text:#eaf7ff;--muted:#6f8c9b;--panel:rgba(7,17,24,.78)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#02070b;color:var(--text);font-family:Segoe UI,Arial,sans-serif;overflow-x:hidden}body{background:radial-gradient(circle at 30% 20%,rgba(33,118,136,.22),transparent 34%),radial-gradient(circle at 72% 26%,rgba(131,22,42,.20),transparent 36%),linear-gradient(#02070b,#050b10 58%,#020609)}
.grid{position:fixed;inset:0;pointer-events:none;opacity:.22;background-image:linear-gradient(rgba(92,231,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(92,231,255,.05) 1px,transparent 1px);background-size:34px 34px;mask-image:linear-gradient(to bottom,rgba(0,0,0,.8),transparent)}
.scan{position:fixed;left:0;right:0;height:2px;z-index:20;pointer-events:none;background:linear-gradient(90deg,transparent,var(--jarvis),white,var(--ultron),transparent);box-shadow:0 0 20px rgba(92,231,255,.8);animation:scan 5.4s linear infinite;opacity:.45}@keyframes scan{0%{top:-2%}100%{top:102%}}
.boot{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:#010408;transition:opacity .9s ease,visibility .9s ease}.boot.hidden{opacity:0;visibility:hidden}.boot-inner{text-align:center;width:min(92vw,760px)}.boot-title{font-size:clamp(1.2rem,4vw,2.4rem);letter-spacing:.24em;margin-bottom:28px}.boot-line{height:4px;background:#101a22;border:1px solid #20313e;overflow:hidden}.boot-line i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--jarvis),#fff,var(--ultron));box-shadow:0 0 18px var(--jarvis);animation:bootbar 3s ease forwards}@keyframes bootbar{to{width:100%}}.boot-log{margin-top:15px;color:#7896a5;font:12px ui-monospace,Consolas,monospace;min-height:20px}
.shell{width:min(1500px,100%);margin:auto;padding:18px;opacity:0;transform:translateY(12px);animation:reveal 1s ease 3.1s forwards}@keyframes reveal{to{opacity:1;transform:none}}
header{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 4px 22px}.brand small{display:block;color:#718d9d;letter-spacing:.18em}.brand h1{margin:4px 0 0;font-size:clamp(1.35rem,3.8vw,2.5rem);font-weight:600;letter-spacing:.07em}.online{display:flex;gap:8px;align-items:center;color:#7ee9c2;font-size:.78rem;letter-spacing:.12em}.dot{width:9px;height:9px;border-radius:50%;background:#55e7ad;box-shadow:0 0 16px #55e7ad;animation:pulse 1.5s ease-in-out infinite}@keyframes pulse{50%{transform:scale(1.6);opacity:.6}}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:14px;min-height:650px}.core-card{position:relative;overflow:hidden;border:1px solid #203541;background:linear-gradient(180deg,rgba(8,18,25,.9),rgba(3,8,12,.96));min-height:650px;display:grid;place-items:center;isolation:isolate}.core-card:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at center,var(--glow),transparent 42%);opacity:.25;z-index:-2}.core-card:after{content:"";position:absolute;inset:12px;border:1px solid rgba(255,255,255,.05);clip-path:polygon(0 0,38% 0,42% 3px,58% 3px,62% 0,100% 0,100% 100%,0 100%);z-index:-1}.jarvis{--accent:var(--jarvis);--glow:rgba(92,231,255,.58)}.ultron{--accent:var(--ultron);--glow:rgba(255,63,89,.52)}
.core-wrap{position:relative;width:min(70vw,360px);aspect-ratio:1;display:grid;place-items:center}.ring{position:absolute;border-radius:50%;border:1px solid color-mix(in srgb,var(--accent) 70%,transparent);box-shadow:0 0 14px color-mix(in srgb,var(--accent) 30%,transparent),inset 0 0 14px color-mix(in srgb,var(--accent) 20%,transparent)}.r1{inset:4%;border-width:2px;animation:spin 11s linear infinite}.r2{inset:15%;border-style:dashed;animation:spinR 7s linear infinite}.r3{inset:26%;border-width:2px;animation:spin 5s linear infinite}.r4{inset:35%;border-style:dotted;animation:spinR 3s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@keyframes spinR{to{transform:rotate(-360deg)}}
.tick{position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(from 0deg,var(--accent) 0 1deg,transparent 1deg 8deg);mask:radial-gradient(circle,transparent 64%,#000 65% 67%,transparent 68%);opacity:.36;animation:spin 24s linear infinite}.orb{width:28%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 38% 32%,#fff 0 7%,var(--accent) 18%,color-mix(in srgb,var(--accent) 35%,#000) 52%,#02070b 74%);box-shadow:0 0 24px var(--accent),0 0 70px color-mix(in srgb,var(--accent) 45%,transparent);animation:orb 2.1s ease-in-out infinite}@keyframes orb{50%{transform:scale(1.08);filter:brightness(1.3)}}
.hudtext{position:absolute;inset:auto 0 36px;text-align:center}.hudtext h2{margin:0;color:var(--accent);letter-spacing:.24em;font-size:1.3rem;text-shadow:0 0 14px color-mix(in srgb,var(--accent) 60%,transparent)}.hudtext p{margin:7px 0 15px;color:#7894a3;font-size:.72rem;letter-spacing:.13em}.launch{display:inline-block;border:1px solid var(--accent);padding:10px 16px;color:var(--accent);text-decoration:none;font-size:.72rem;letter-spacing:.11em;background:rgba(0,0,0,.24);box-shadow:inset 0 0 18px color-mix(in srgb,var(--accent) 10%,transparent);transition:.2s}.launch:hover{background:color-mix(in srgb,var(--accent) 13%,transparent);transform:translateY(-2px)}
.statusbar{margin-top:14px;border:1px solid #1d303b;background:rgba(5,12,17,.75);padding:12px 14px;display:flex;justify-content:space-between;gap:12px;color:#6e8998;font:11px ui-monospace,Consolas,monospace}.statusbar b{color:#cce8f2}
@media(max-width:800px){.hero{grid-template-columns:1fr;min-height:0}.core-card{min-height:540px}.core-wrap{width:min(78vw,340px)}header{align-items:flex-start}.statusbar{flex-direction:column}.hudtext{bottom:24px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}.boot{display:none}.shell{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="grid"></div><div class="scan"></div>
<div class="boot" id="boot"><div class="boot-inner"><div class="boot-title">DUAL SYSTEM INITIALIZATION</div><div class="boot-line"><i></i></div><div class="boot-log" id="bootLog">JARVIS CORE // INITIALIZING</div></div></div>
<main class="shell">
<header><div class="brand"><small>PROJECT NOVA // ASSISTANT NETWORK</small><h1>JARVIS + ULTRON SYSTEM HUB</h1></div><div class="online"><span class="dot"></span>DUAL LINK ONLINE</div></header>
<section class="hero">
<article class="core-card jarvis"><div class="core-wrap"><span class="ring r1"></span><span class="ring r2"></span><span class="ring r3"></span><span class="ring r4"></span><span class="tick"></span><span class="orb"></span></div><div class="hudtext"><h2>JARVIS</h2><p>ASSISTANT CORE // READY</p><a class="launch" href="upload-jarvis.html">OPEN JARVIS</a></div></article>
<article class="core-card ultron"><div class="core-wrap"><span class="ring r1"></span><span class="ring r2"></span><span class="ring r3"></span><span class="ring r4"></span><span class="tick"></span><span class="orb"></span></div><div class="hudtext"><h2>ULTRON</h2><p>MECHANICAL DIAGNOSTIC CORE // READY</p><a class="launch" href="https://github.com/howarthjakob4-prog/Ultron-s-face" target="_blank" rel="noopener">OPEN ULTRON</a></div></article>
</section>
<div class="statusbar"><span>JARVIS LINK: <b>STANDBY</b></span><span>ULTRON LINK: <b>STANDBY</b></span><span>HUB BUILD: <b>RESTORED</b></span></div>
</main>
<script>
const boot=document.getElementById('boot'),log=document.getElementById('bootLog');
const steps=['JARVIS CORE // INITIALIZING','JARVIS CORE // ONLINE','ULTRON DIAGNOSTICS // INITIALIZING','ULTRON DIAGNOSTICS // ONLINE','DUAL LINK // ESTABLISHED'];let i=0;
const timer=setInterval(()=>{i++;if(i<steps.length){log.textContent=steps[i]}else{clearInterval(timer)}},560);
setTimeout(()=>boot.classList.add('hidden'),3050);
</script>
</body>
</html>
