<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Upload JARVIS</title>
  <style>
    body{font-family:Arial,sans-serif;background:#0b0f14;color:#eef4ff;margin:0;min-height:100vh;display:grid;place-items:center}
    .card{width:min(92vw,760px);background:#121923;border:1px solid #2c3b4f;border-radius:18px;padding:28px;box-shadow:0 18px 50px rgba(0,0,0,.35)}
    h1{margin-top:0;font-size:34px}.note{color:#b9c6d8;line-height:1.55}.drop{margin-top:22px;border:2px dashed #51657f;border-radius:14px;padding:28px;text-align:center}.drop.active{border-style:solid}.file{margin-top:14px;font-weight:700}.status{margin-top:18px;padding:12px;border-radius:10px;background:#0d141d;min-height:24px}button{margin-top:16px;padding:12px 18px;border:0;border-radius:10px;font-weight:700;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}input{margin-top:14px;max-width:100%}iframe{width:100%;height:60vh;border:1px solid #2c3b4f;border-radius:12px;margin-top:20px;background:#fff;display:none}
  </style>
</head>
<body>
  <main class="card">
    <h1>Upload JARVIS</h1>
    <p class="note">This website does not generate JARVIS. You must upload your own JARVIS HTML file before it can run here.</p>
    <div class="drop" id="drop">
      <strong>Select your JARVIS HTML file</strong><br>
      <input id="file" type="file" accept=".html,.htm,text/html">
      <div class="file" id="fileName">No file selected</div>
    </div>
    <button id="continueBtn" disabled>Use uploaded JARVIS</button>
    <div class="status" id="status">Waiting for a JARVIS upload.</div>
    <iframe id="jarvisFrame" sandbox="allow-scripts allow-forms allow-modals allow-popups allow-downloads"></iframe>
  </main>
<script>
const fileInput=document.getElementById('file');
const fileName=document.getElementById('fileName');
const status=document.getElementById('status');
const continueBtn=document.getElementById('continueBtn');
const drop=document.getElementById('drop');
const frame=document.getElementById('jarvisFrame');
let uploadedJarvis=null;
let uploadedText='';

async function setFile(file){
  uploadedJarvis=null; uploadedText=''; frame.style.display='none'; frame.removeAttribute('srcdoc');
  if(!file){fileName.textContent='No file selected';status.textContent='Waiting for a JARVIS upload.';continueBtn.disabled=true;drop.classList.remove('active');return;}
  const ext=(file.name.split('.').pop()||'').toLowerCase();
  if(!['html','htm'].includes(ext)){fileInput.value='';fileName.textContent='Unsupported file';status.textContent='Please upload a JARVIS .html or .htm file.';continueBtn.disabled=true;return;}
  if(file.size>10*1024*1024){fileInput.value='';fileName.textContent='File too large';status.textContent='JARVIS HTML must be 10 MB or smaller.';continueBtn.disabled=true;return;}
  try{
    uploadedText=await file.text();
    if(!uploadedText.trim()){throw new Error('empty');}
    uploadedJarvis=file;
    fileName.textContent=file.name;
    status.textContent='JARVIS loaded and ready. Nothing was generated by this website.';
    continueBtn.disabled=false;drop.classList.add('active');
  }catch(e){fileInput.value='';fileName.textContent='Could not read file';status.textContent='That JARVIS HTML file could not be opened.';continueBtn.disabled=true;}
}

fileInput.addEventListener('change',()=>setFile(fileInput.files[0]));
continueBtn.addEventListener('click',()=>{
  if(!uploadedJarvis||!uploadedText)return;
  try{
    localStorage.setItem('jarvisUploadName',uploadedJarvis.name);
    localStorage.setItem('jarvisUploadHtml',uploadedText);
    localStorage.setItem('jarvisUploadReady','true');
  }catch(e){status.textContent='JARVIS is running for this session, but your browser could not save it permanently.';}
  frame.srcdoc=uploadedText;
  frame.style.display='block';
  status.textContent='Uploaded JARVIS is now running in the protected website frame.';
});

try{
  const saved=localStorage.getItem('jarvisUploadHtml');
  const savedName=localStorage.getItem('jarvisUploadName');
  if(saved){uploadedText=saved;uploadedJarvis={name:savedName||'Saved JARVIS.html'};fileName.textContent=uploadedJarvis.name+' (saved)';status.textContent='A previously uploaded JARVIS is ready.';continueBtn.disabled=false;drop.classList.add('active');}
}catch(e){}
</script>
</body>
</html>
