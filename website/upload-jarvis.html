<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Upload JARVIS</title>
  <style>
    body{font-family:Arial,sans-serif;background:#0b0f14;color:#eef4ff;margin:0;min-height:100vh;display:grid;place-items:center}
    .card{width:min(92vw,720px);background:#121923;border:1px solid #2c3b4f;border-radius:18px;padding:28px;box-shadow:0 18px 50px rgba(0,0,0,.35)}
    h1{margin-top:0;font-size:34px}.note{color:#b9c6d8;line-height:1.55}.drop{margin-top:22px;border:2px dashed #51657f;border-radius:14px;padding:28px;text-align:center}.drop.active{border-style:solid}.file{margin-top:14px;font-weight:700}.status{margin-top:18px;padding:12px;border-radius:10px;background:#0d141d;min-height:24px}.hidden{display:none}button{margin-top:16px;padding:12px 18px;border:0;border-radius:10px;font-weight:700;cursor:pointer}input{margin-top:14px;max-width:100%}
  </style>
</head>
<body>
  <main class="card">
    <h1>Upload JARVIS</h1>
    <p class="note">This website does not create or generate a JARVIS assistant for you. A JARVIS package must be supplied by the user and uploaded before the website can continue.</p>
    <div class="drop" id="drop">
      <strong>Select your JARVIS file</strong><br>
      <input id="file" type="file" accept=".html,.htm,.zip,.json,.py">
      <div class="file" id="fileName">No file selected</div>
    </div>
    <button id="continueBtn" disabled>Use uploaded JARVIS</button>
    <div class="status" id="status">Waiting for a JARVIS upload.</div>
  </main>
<script>
const fileInput=document.getElementById('file');
const fileName=document.getElementById('fileName');
const status=document.getElementById('status');
const continueBtn=document.getElementById('continueBtn');
const drop=document.getElementById('drop');
let uploadedJarvis=null;

function setFile(file){
  uploadedJarvis=file||null;
  if(!file){
    fileName.textContent='No file selected';
    status.textContent='Waiting for a JARVIS upload.';
    continueBtn.disabled=true;
    drop.classList.remove('active');
    return;
  }
  fileName.textContent=file.name;
  status.textContent='JARVIS file loaded into this browser session. No assistant was generated by the website.';
  continueBtn.disabled=false;
  drop.classList.add('active');
}

fileInput.addEventListener('change',()=>setFile(fileInput.files[0]));
continueBtn.addEventListener('click',()=>{
  if(!uploadedJarvis) return;
  sessionStorage.setItem('jarvisUploadName',uploadedJarvis.name);
  sessionStorage.setItem('jarvisUploadReady','true');
  status.textContent='JARVIS upload accepted. The website may now connect to the supplied JARVIS package.';
});
</script>
</body>
</html>
