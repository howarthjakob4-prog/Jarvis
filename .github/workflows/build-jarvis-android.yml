name: Build JARVIS Android Companion

on:
  workflow_dispatch:
  push:
    branches:
      - jarvis-android-companion
    paths:
      - 'android-companion/**'
      - '.github/workflows/build-jarvis-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: android-companion
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Android-Companion
          path: android-companion/app/build/outputs/apk/debug/app-debug.apk
