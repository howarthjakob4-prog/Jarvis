name: Build JARVIS Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller accelerate
          choco install innosetup -y --no-progress

      - name: Scan Jarvis for Python and integration bugs
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m compileall -q jarvis stage1 tests tools
          python -c "import importlib.metadata as m; assert m.version('jarvis') == '1.0.5'; print('Package version OK:', m.version('jarvis'))"
          python -c "from jarvis.ui.local_model_loader import install_local_model_loader; assert callable(install_local_model_loader); print('GGUF model loader integration OK')"
          python -c "from jarvis.brain import project_workspace; from jarvis.plugins.project_workspace_plugin import ProjectWorkspacePlugin; tools = ProjectWorkspacePlugin().get_tools(); assert len(tools) >= 7; print(f'Project workspace integration OK: {len(tools)} tools')"
          python -c "from jarvis.brain.design_engine import preset, obj_text; s=preset('achilles'); assert len(s['objects']) > 100; assert obj_text(s).startswith('# Nova Frontier'); print('3D design engine OK:', len(s['objects']), 'Achilles parts')"
          python -m unittest tests.test_design_engine tests.test_design_reference tests.test_design_renderer tests.test_design_workspace
          python -c "from jarvis.voice.tts import DEFAULT_JARVIS_VOICE, TTS; assert DEFAULT_JARVIS_VOICE == 'kokoro:bm_george'; box=TTS(); assert box.status()['voice']; print('Kokoro George voice integration OK')"
          python -m pip check
          if (-not (Select-String -Path 'installer/jarvis_setup.iss' -Pattern '^AppVersion=1\.0\.5$' -Quiet)) { throw 'Installer AppVersion is not 1.0.5' }
          if (-not (Select-String -Path 'installer/jarvis_setup.iss' -Pattern '^OutputBaseFilename=JARVIS-Setup-v1\.0\.5$' -Quiet)) { throw 'Installer filename is not versioned as 1.0.5' }

      - name: Build JARVIS installer
        shell: pwsh
        run: |
          python build_exe.py --installer

      - name: Verify installer and runtime data
        shell: pwsh
        run: |
          if (!(Test-Path 'installer/JARVIS-Setup-v1.0.5.exe')) { throw 'JARVIS 1.0.5 installer was not created' }
          if (!(Test-Path 'dist/JARVIS/_internal/kokoro_onnx/config.json')) { throw 'Kokoro config.json is missing from packaged JARVIS runtime' }
          if (!(Test-Path 'dist/JARVIS/_internal/jarvis/ui/local_model_loader.py')) { Write-Host 'Local model loader packaged through PyInstaller bytecode/import graph' }
          if (!(Test-Path 'dist/JARVIS/_internal/jarvis/ui/design_workspace.py')) { Write-Host '3D workspace packaged through PyInstaller bytecode/import graph' }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-1.0.5-Windows-Installer
          path: installer/JARVIS-Setup-v1.0.5.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish latest Windows installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete jarvis-windows-latest --yes --cleanup-tag 2>$null
          if ($LASTEXITCODE -ne 0) { $global:LASTEXITCODE = 0 }
          gh release create jarvis-windows-latest installer/JARVIS-Setup-v1.0.5.exe --title "JARVIS 1.0.5 Windows Installer" --notes "JARVIS 1.0.5 fixes the local-model setup problem by adding an always-available Load AI Model (.gguf) control (Ctrl+M). Selecting an existing GGUF file enables the local llama.cpp provider and saves the model path. This build also retains the 1.0.4 voice, 3D studio, and updater fixes." --latest
