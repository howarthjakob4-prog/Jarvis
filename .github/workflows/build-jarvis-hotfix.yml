name: Build JARVIS Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller accelerate

      - name: Build JARVIS EXE
        shell: pwsh
        run: |
          python build_exe.py

      - name: Verify EXE exists
        shell: pwsh
        run: |
          if (!(Test-Path 'dist/JARVIS.exe')) { throw 'dist/JARVIS.exe was not created' }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Windows
          path: dist/JARVIS.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest Windows download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete jarvis-windows-latest --yes --cleanup-tag 2>$null
          if ($LASTEXITCODE -ne 0) { $global:LASTEXITCODE = 0 }
          gh release create jarvis-windows-latest dist/JARVIS.exe --title "JARVIS Windows Download" --notes "Latest Windows build of JARVIS." --latest
