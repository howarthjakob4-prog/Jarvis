name: Build JARVIS Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller accelerate
          choco install innosetup -y --no-progress

      - name: Scan Jarvis for Python and integration bugs
        shell: pwsh
        run: |
          python -m compileall -q jarvis stage1
          python -c "from jarvis.brain import project_workspace; from jarvis.plugins.project_workspace_plugin import ProjectWorkspacePlugin; tools = ProjectWorkspacePlugin().get_tools(); assert len(tools) >= 7; print(f'Project workspace integration OK: {len(tools)} tools')"
          python -c "from jarvis.voice.tts import DEFAULT_JARVIS_VOICE, TTS; assert DEFAULT_JARVIS_VOICE == 'kokoro:bm_george'; box=TTS(); assert box.status()['voice']; print('Kokoro George voice integration OK')"
          python -m pip check

      - name: Build JARVIS installer
        shell: pwsh
        run: |
          python build_exe.py --installer

      - name: Verify installer and Kokoro runtime data
        shell: pwsh
        run: |
          if (!(Test-Path 'installer/JARVIS-Setup-v1.exe')) { throw 'JARVIS installer was not created' }
          if (!(Test-Path 'dist/JARVIS/_internal/kokoro_onnx/config.json')) { throw 'Kokoro config.json is missing from packaged JARVIS runtime' }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Windows-Installer
          path: installer/JARVIS-Setup-v1.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish latest Windows installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete jarvis-windows-latest --yes --cleanup-tag 2>$null
          if ($LASTEXITCODE -ne 0) { $global:LASTEXITCODE = 0 }
          gh release create jarvis-windows-latest installer/JARVIS-Setup-v1.exe --title "JARVIS Windows Installer" --notes "JARVIS 1.0.3 hotfix bundles the Kokoro runtime configuration required by the bm_george voice. The Kokoro model downloads on first voice use. This build passed the Jarvis pre-build and packaged-runtime checks." --latest
