name: Build JARVIS Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller accelerate
          choco install innosetup -y --no-progress

      - name: Build JARVIS installer
        shell: pwsh
        run: |
          python build_exe.py --installer

      - name: Verify installer exists
        shell: pwsh
        run: |
          if (!(Test-Path 'installer/JARVIS-Setup-v1.exe')) { throw 'JARVIS installer was not created' }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Windows-Installer
          path: installer/JARVIS-Setup-v1.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish latest Windows installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete jarvis-windows-latest --yes --cleanup-tag 2>$null
          if ($LASTEXITCODE -ne 0) { $global:LASTEXITCODE = 0 }
          gh release create jarvis-windows-latest installer/JARVIS-Setup-v1.exe --title "JARVIS Windows Installer" --notes "Low-storage Windows installer. Browser automation components are optional and are not downloaded during setup." --latest
