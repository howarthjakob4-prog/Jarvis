name: Build JARVIS Windows Hotfix

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller

      - name: Build patched JARVIS EXE
        shell: pwsh
        run: |
          python build_exe.py

      - name: Verify EXE exists
        shell: pwsh
        run: |
          if (!(Test-Path 'dist/JARVIS.exe')) { throw 'dist/JARVIS.exe was not created' }

      - name: Upload patched JARVIS
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Windows-Bridge-Hotfix
          path: dist/JARVIS.exe
          if-no-files-found: error
          retention-days: 14
