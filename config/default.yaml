jarvis:
  name: "JARVIS"
  user_name: ""
  language: "en"
  data_dir: "data"

voice:
  enabled: true
  wake_word: "hey jarvis"
  wake_word_sensitivity: 0.6
  always_listening: false
  stt_model: "tiny.en"        # tiny.en = fast on CPU and keeps the voice footprint small
  tts_voice: "en-GB-RyanNeural"
  tts_speed: "+5%"
  tts_engine: "edge-tts"
  input_device: null
  output_device: null

phone_approvals:
  enabled: false
  owner_phone: ""
  verified: false
  allow_calls: true
  allow_texts: true
  notify_when_lid_closed: true
  call_if_notification_unanswered: true
  approval_timeout_seconds: 300
  require_verification_code: true
  provider: ""
  provider_phone_number: ""
  log_events: true
  log_file: "data/logs/phone_approvals.log"

ai:
  primary_provider: "groq"
  fallback_order: ["groq", "mistral", "gemini", "openrouter", "ollama", "llamacpp"]
  max_memory_messages: 20
  temperature: 0.65
  providers:
    ollama:
      enabled: false              # local multi-GB models are opt-in on low-storage systems
      model: "llama3.1:8b"
      base_url: "http://localhost:11434"
      timeout: 30
    groq:
      enabled: false
      api_key: ""
      model: "llama-3.1-70b-versatile"
    gemini:
      enabled: false
      api_key: ""
      model: "gemini-2.0-flash"
    openrouter:
      enabled: false
      api_key: ""
      model: "meta-llama/llama-3.1-8b-instruct:free"
    llamacpp:
      enabled: false
      model_path: ""
      mmproj_path: ""
      draft_model_path: ""
      base_url: "http://127.0.0.1:8080/v1"
      host: "127.0.0.1"
      port: 8080
      n_gpu_layers: 99
      n_gpu_layers_draft: 99
      context_size: 16384
      parallel: 2
      batch_size: 2048
      ubatch_size: 2048
      flash_attn: true
      no_mmap: true
      mlock: true
      cont_batching: true
      prio: 2
      kv_cache_type_k: "q4_0"
      kv_cache_type_v: "q4_0"
      n_cpu_moe: 0
      reasoning: ""
      reasoning_budget: -1
      reasoning_loop_guard: ""
      spec_type: ""
      spec_draft_n_max: 3
      spec_draft_p_min: 0.75
      spec_dflash_cross_ctx: 512

control:
  browser: "chromium"
  confirm_destructive: true
  allowed_directories: []

watcher:
  enabled: false
  interval_seconds: 15
  provider: "auto"
  quiet_apps:
    - "zoom"
    - "teams"
    - "discord"
    - "netflix"
    - "youtube"
  max_suggestions_per_hour: 12

mcp:
  servers: []

plugins:
  email_enabled: false
  telegram_enabled: false
  spotify_enabled: false
  image_gen_enabled: true

ui:
  show_overlay: true
  chat_hotkey: "ctrl+shift+j"
  theme: "dark"

startup:
  auto_start: true
  start_minimized: true

logging:
  level: "INFO"
  file: "data/logs/jarvis.log"
  max_size: "2MB"
  retention: 3

# Low-storage defaults: keep voice enabled, avoid automatic local-model downloads,
# keep history smaller, and aggressively cap/rotate logs.
